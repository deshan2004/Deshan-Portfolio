<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe" />
      <stop offset="100%" stop-color="#4facfe" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffe066" />
      <stop offset="50%" stop-color="#f5af19" />
      <stop offset="100%" stop-color="#e14e11" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Dark Obsidian Base -->
  <rect width="512" height="512" rx="110" fill="#0b0f19" />

  <!-- Outer D Path (Cyan & Gold dual stroke) -->
  <path d="M 130 96 H 260 C 360 96 426 156 426 256 C 426 356 360 416 260 416 H 130 Z" 
        fill="none" stroke="url(#cyanGrad)" stroke-width="46" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <path d="M 260 96 C 360 96 426 156 426 256 C 426 356 360 416 260 416" 
        fill="none" stroke="url(#goldGrad)" stroke-width="46" stroke-linecap="round" />

  <!-- Inner Chevron / Code Angle Bracket '>' -->
  <path d="M 215 186 L 285 256 L 215 326" 
        fill="none" stroke="url(#goldGrad)" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Code Slash '/' Accent -->
  <line x1="165" y1="130" x2="145" y2="382" stroke="url(#cyanGrad)" stroke-width="32" stroke-linecap="round" />
</svg>
